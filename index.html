<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Attendance App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<h1>Staff Dashboard</h1>

<div class="card">
<h3>Attendance Calendar</h3>
<div id="calendar" class="calendar"></div>
</div>

<div class="card">
<h3>Leave Balance</h3>
<p>Paid Leave: <span id="paid">12</span></p>
<p>Comp Off: <span id="comp">2</span></p>
<button id="leaveBtn">Apply Leave</button>
</div>

<div class="card">
<h3>Salary Details</h3>
<p>Basic: ₹25,000</p>
<p>Net Salary: ₹32,500</p>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
