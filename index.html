<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Airdoor Staff Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b;}
a{text-decoration:none;color:inherit;}
/* Layout */
.sidebar{width:240px;min-height:100vh;background:#1e293b;color:#e2e8f0;position:fixed;top:0;left:0;z-index:40;display:flex;flex-direction:column;}
.main{margin-left:240px;min-height:100vh;}
.main-pad{padding:28px 32px;}
/* Nav */
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-radius:8px;margin:2px 8px;font-size:13px;color:#94a3b8;transition:background .15s,color .15s;}
.nav-item:hover{background:#334155;color:#fff;}
.nav-item.active{background:#0f766e;color:#fff;}
/* Cards */
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;}
.stat-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600;white-space:nowrap;}
.bg-green{background:#dcfce7;color:#166534;}
.bg-red{background:#fee2e2;color:#991b1b;}
.bg-yellow{background:#fef9c3;color:#854d0e;}
.bg-blue{background:#dbeafe;color:#1e40af;}
.bg-gray{background:#f1f5f9;color:#475569;}
.bg-purple{background:#f3e8ff;color:#7e22ce;}
.bg-teal{background:#ccfbf1;color:#0f766e;}
.bg-orange{background:#ffedd5;color:#c2410c;}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:opacity .15s;}
.btn:hover{opacity:.88;}
.btn-p{background:#0f766e;color:#fff;}
.btn-o{background:#fff;color:#374151;border:1px solid #d1d5db;}
.btn-d{background:#ef4444;color:#fff;}
.btn-s{background:#22c55e;color:#fff;}
.btn-sm{padding:4px 10px;font-size:12px;}
/* Forms */
.input{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;outline:none;background:#fff;transition:border-color .15s;}
.input:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.1);}
#loginPage .input::placeholder{color:rgba(163,203,229,.5);}
#loginPage .input:focus{border-color:#A3CBE5;box-shadow:0 0 0 3px rgba(163,203,229,.2);}
.label{display:block;font-size:12px;font-weight:500;color:#374151;margin-bottom:4px;}
textarea.input{resize:vertical;}
/* Table */
table{width:100%;border-collapse:collapse;}
th{background:#f8fafc;padding:9px 14px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #e2e8f0;}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid #f1f5f9;}
tr:hover td{background:#f8fafc;}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:#fff;border-radius:16px;width:480px;max-width:100%;max-height:90vh;overflow-y:auto;}
/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:transform .1s;user-select:none;}
.cal-day:not(.cal-future):not(.cal-sun):hover{transform:scale(1.1);}
.cal-today{outline:2px solid #0f766e;outline-offset:1px;}
.cal-present{background:#dcfce7;color:#166534;border-color:#86efac;}
.cal-half{background:#fef9c3;color:#854d0e;border-color:#fde68a;}
.cal-absent{background:#fee2e2;color:#991b1b;border-color:#fca5a5;}
.cal-swork{background:#ccfbf1;color:#0f766e;border-color:#5eead4;}
.cal-hwork{background:#f3e8ff;color:#7e22ce;border-color:#d8b4fe;}
.cal-leave{background:#dbeafe;color:#1e40af;border-color:#93c5fd;}
.cal-holiday{background:#f3e8ff;color:#7e22ce;border-color:#c4b5fd;}
.cal-sun{background:#f1f5f9;color:#94a3b8;cursor:default;}
.cal-pending{background:#ffedd5;color:#c2410c;border-color:#fdba74;}
.cal-miss{background:#fff1f2;color:#be123c;border-color:#fda4af;}
.cal-today-log{background:#fefce8;color:#854d0e;border-color:#fde047;}
.cal-future{background:#f8fafc;color:#cbd5e1;cursor:default;border-color:#f1f5f9;}
/* Alerts */
.alert-amber{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;margin-bottom:20px;}
.alert-blue{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;margin-bottom:16px;overflow:hidden;}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:999;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;pointer-events:none;animation:su .3s ease;}
@keyframes su{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast-ok{background:#1e293b;color:#fff;}
.toast-err{background:#ef4444;color:#fff;}
/* Notif dot */
.ndot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#ef4444;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
/* Mobile */
.mob-header{display:none;position:sticky;top:0;z-index:30;background:#3E75A5;border-bottom:1px solid #224366;padding:10px 16px;align-items:center;justify-content:space-between;}
/* Bot nav */
.bot-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#15283D;border-top:2px solid #224366;height:70px;box-shadow:0 -4px 20px rgba(21,40,61,.25);}
.bot-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:700;color:#A3CBE5;cursor:pointer;border:none;background:none;letter-spacing:.3px;transition:color .15s,background .15s;padding:0;min-width:0;}
.bot-item.active{color:#fff;background:rgba(163,203,229,.15);}
.bot-item:active{background:rgba(163,203,229,.2);}
.bot-item svg{flex-shrink:0;}
.bot-fab{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#3E75A5,#224366);display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 4px 16px rgba(62,117,165,.6);border:2px solid #A3CBE5;}
/* Grid helpers */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
/* Switch menu */
.switch-menu{background:#0f1729;border-radius:8px;margin:2px 8px;overflow:hidden;display:none;}
/* Notif panel */
.npanel{display:none;position:absolute;top:calc(100% + 4px);right:0;width:300px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:99;overflow:hidden;}
/* Responsive */
@media(max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .mob-header{display:flex;}
  .main-pad{padding:16px 16px 86px;}
  .g4{grid-template-columns:1fr 1fr;}
  .g2{grid-template-columns:1fr;}
}
@media print{
  .sidebar,.mob-header,.bot-nav,.no-print{display:none!important;}
  .main{margin-left:0;}
}
</style>
</head>

};

const _app = initializeApp(firebaseConfig);
const _db  = getFirestore(_app);

// Firestore collection names
const FS = {
  'hr_u':  'hr_users',
  'hr_a':  'hr_att',
  'hr_l':  'hr_leaves',
  'hr_h':  'hr_holidays',
  'hr_s':  'hr_sal',
  'hr_n':  'hr_notif'
};

// In-memory cache — app reads here (sync), writes go to both cache + Firestore
window._MC = {};

window._fsLoad = async function(){
  for(var k in FS){
    try{
      var snap = await getDoc(doc(_db, 'attendance_portal', FS[k]));
      if(snap.exists() && snap.data().value !== undefined){
        window._MC[k] = snap.data().value;
      }
    }catch(e){ console.warn('Firestore load fail:',k,e); }
  }
};

window._fsSave = function(k, v){
  window._MC[k] = v;
  if(!FS[k]) return;
  setDoc(doc(_db, 'attendance_portal', FS[k]), {value: v}).catch(function(e){
    console.warn('Firestore save fail:',k,e);
  });
};
</script>

function pushNotif(uid,title,msg,type){
  var n=getN();
  n.push({id:nid(n),userId:uid,title:title,message:msg,type:type,read:false,createdAt:new Date().toISOString()});
  setN(n);
  updateNBadge();
}
function updateNBadge(){
  if(!CU)return;
  var count=getN().filter(function(n){return n.userId===CU.id&&!n.read;}).length;
  var el=document.getElementById('nbadge');
  if(!el)return;
  if(count>0){el.style.display='flex';el.textContent=count>9?'9+':String(count);}
  else el.style.display='none';
}
function renderNotifList(){
  var items=getN().filter(function(n){return n.userId===CU.id;}).sort(function(a,b){return b.createdAt.localeCompare(a.createdAt);}).slice(0,20);
  var ico={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  var html=items.length===0?'<div style="padding:24px;text-align:center;color:#94a3b8;font-size:13px">No notifications yet</div>':
    items.map(function(n){
      return '<div onclick="readN('+n.id+')" style="padding:11px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;background:'+(n.read?'#fff':'#eff6ff')+'">'
        +'<div style="display:flex;align-items:flex-start;gap:8px">'
        +'<span style="font-size:14px;flex-shrink:0">'+(ico[n.type]||'ℹ️')+'</span>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:12px;font-weight:'+(n.read?'500':'700')+';color:#1e293b">'+n.title+'</div>'
        +'<div style="font-size:11px;color:#64748b;margin-top:2px">'+n.message+'</div>'
        +'<div style="font-size:10px;color:#94a3b8;margin-top:3px">'+ago(n.createdAt)+'</div>'
        +'</div>'+(n.read?'':'<div style="width:7px;height:7px;border-radius:50%;background:#3b82f6;flex-shrink:0;margin-top:3px"></div>')
        +'</div></div>';
    }).join('');
  document.getElementById('notifList').innerHTML=html;
}
function readN(id){
  var n=getN();var i=n.findIndex(function(x){return x.id===id;});
  if(i>=0)n[i].read=true;setN(n);renderNotifList();updateNBadge();
}
function markAllRead(){
  var n=getN().map(function(x){return x.userId===CU.id?Object.assign({},x,{read:true}):x;});
  setN(n);renderNotifList();updateNBadge();

}
function toggleNotif(){
  renderNotifList();

  p.style.display=p.style.display==='none'?'block':'none';
}

  var att=getA().filter(function(a){return a.userId===uid&&a.status==='approved';});
  var hols=getH();
  var paid=0;
  att.forEach(function(a){
    var d=new Date(a.date+'T00:00:00');
    if(d.getFullYear()!==year||d.getMonth()+1!==month)return;
    if(a.type==='present'||a.type==='sunday_work'||a.type==='holiday_work')paid+=1;
    else if(a.type==='half_day')paid+=0.5;
    else if(a.type==='leave')paid+=1;
  });
  hols.forEach(function(h){
    var d=new Date(h.date+'T00:00:00');
    if(d.getFullYear()===year&&d.getMonth()+1===month)paid+=1;
  });
  var user=getU().filter(function(u){return u.id===uid;})[0];
  var mo=user?Number(user.monthlySalary):0;
  var wd=26;
  var gross=Math.min(mo,mo/wd*paid);
  return{paid:Math.min(paid,wd),wd:wd,gross:gross,ded:Math.max(0,mo-gross),net:gross,mo:mo};
}
function leaveBal(uid){
  var leaves=getL().filter(function(l){return l.userId===uid&&l.status==='approved';});
  var cu=0,su=0,co=0,pu=0;
  leaves.forEach(function(l){
    var d=Math.round((new Date(l.endDate)-new Date(l.startDate))/86400000)+1;
    if(l.type==='casual')cu+=d;
    else if(l.type==='sick')su+=d;
    else if(l.type==='comp_off')co+=d;
    else if(l.type==='personal')pu+=d;
  });
  var earned=getA().filter(function(a){return a.userId===uid&&a.status==='approved'&&(a.type==='sunday_work'||a.type==='holiday_work');}).length;
  return{casUsed:cu,casLeft:Math.max(0,12-cu),sikUsed:su,compEarned:earned,compLeft:Math.max(0,earned-co),personalUsed:pu};
}

function renderCal(){
  var el=document.getElementById('calGrid');
  if(!el)return;
  var y=calM.y,m=calM.m;
  var titleEl=document.getElementById('calTitle');
  if(titleEl)titleEl.textContent=mn(m)+' '+y;
  var hols=getH();var att=getA().filter(function(a){return a.userId===CU.id;});
  var aMap={};att.forEach(function(a){aMap[a.date]=a;});
  var hMap={};hols.forEach(function(h){hMap[h.date]=h.name;});
  var todayStr=td();
  var first=new Date(y,m-1,1);
  var lastD=new Date(y,m,0).getDate();
  var startDow=first.getDay();
  var html='';
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var d=1;d<=lastD;d++){
    var ds=y+'-'+pad(m)+'-'+pad(d);
    var isSun=new Date(ds+'T00:00:00').getDay()===0;
    var isHol=!!hMap[ds];
    var rec=aMap[ds];
    var isPast=ds<todayStr;
    var isToday=ds===todayStr;
    var isFuture=ds>todayStr;
    var cls='cal-day';
    var extra='';
    if(isToday)cls+=' cal-today';
    var canClick=false;
    var clickable='';
    if(rec){
      if(rec.status==='pending')cls+=' cal-pending';
      else if(rec.status==='rejected')cls+=' cal-miss';
      else{
        var tc={present:'cal-present',half_day:'cal-half',absent:'cal-absent',sunday_work:'cal-swork',holiday_work:'cal-hwork',leave:'cal-leave'};
        cls+=' '+(tc[rec.type]||'cal-present');
      }
      canClick=true;
    } else if(isFuture){
      if(isSun)cls+=' cal-sun';
      else if(isHol)cls+=' cal-holiday';
      else cls+=' cal-future';
    } else if(isToday){
      if(isSun)cls+=' cal-sun';
      else if(isHol)cls+=' cal-holiday';
      else{cls+=' cal-today-log';canClick=true;}
    } else {
      if(isSun)cls+=' cal-sun';
      else if(isHol)cls+=' cal-holiday';
      else{cls+=' cal-miss';canClick=true;}
    }
    if(canClick)clickable=' onclick="openDay(\''+ds+'\')"';
    html+='<div class="'+cls+'"'+clickable+' title="'+d+(isHol?' - '+hMap[ds]:'')+'"><span>'+d+'</span>'+(isSun&&!rec?'<span style="font-size:8px;opacity:.6">off</span>':'')+'</div>';
  }
  el.innerHTML=html;
}
function pad(n){return n<10?'0'+n:String(n);}
function calPrev(){calM.m--;if(calM.m<1){calM.m=12;calM.y--;}renderCal();}

  var att=getA();var i=att.findIndex(function(a){return a.id===id;});

  go(CP);toast('Attendance rejected');
}

function renderSalTbl(month,year){
  var users=getU().filter(function(u){return u.role==='employee';});
  return '<div style="overflow-x:auto"><table><thead><tr><th>Employee</th><th>Monthly</th><th>Paid Days</th><th>Gross</th><th>Deductions</th><th>Net Pay</th><th>Status</th><th>Action</th></tr></thead><tbody>'
    +users.map(function(u){
      var c=calcSal(u.id,month,year);
      var sr=getS().filter(function(s){return s.userId===u.id&&s.month===month&&s.year===year;})[0];
      return '<tr><td><div style="font-weight:500;font-size:13px">'+u.name+'</div><div style="font-size:11px;color:#64748b">'+(u.designation||'')+'</div></td>'
        +'<td>'+ru(c.mo)+'</td><td>'+c.paid.toFixed(1)+'/'+c.wd+'</td>'
        +'<td>'+ru(c.gross)+'</td><td style="color:#ef4444">'+ru(c.ded)+'</td>'
        +'<td style="font-weight:600;color:#0f766e">'+ru(c.net)+'</td>'
        +'<td>'+(sr?badge(sr.status):'<span class="badge bg-gray">Not Run</span>')+'</td>'
        +'<td>'+(sr&&sr.status==='pending'?'<button class="btn btn-s btn-sm" onclick="approveSal('+u.id+','+month+','+year+')">Approve</button>':'&mdash;')+'</td></tr>';
    }).join('')
    +'</tbody></table></div>';
}
function refreshSal(){var m=Number(document.getElementById('salMo').value);var y=Number(document.getElementById('salYr').value);document.getElementById('salTbl').innerHTML=renderSalTbl(m,y);}
function runPayroll(){
  var m=Number(document.getElementById('salMo').value);var y=Number(document.getElementById('salYr').value);
  var users=getU().filter(function(u){return u.role==='employee';});var sal=getS();
  users.forEach(function(u){
    if(!sal.filter(function(s){return s.userId===u.id&&s.month===m&&s.year===y;}).length){
      var c=calcSal(u.id,m,y);sal.push(Object.assign({id:nid(sal),userId:u.id,month:m,year:y,status:'pending'},c));
    }
  });
  setS(sal);refreshSal();toast('Payroll generated');
}
function approveSal(uid,month,year){
  var sal=getS();var i=sal.findIndex(function(s){return s.userId===uid&&s.month===month&&s.year===year;});
  if(i>=0){sal[i].status='approved';setS(sal);}
  var c=calcSal(uid,month,year);
  pushNotif(uid,'Salary Credited','Your salary of '+ru(c.net)+' for '+mn(month)+' '+year+' has been processed.','success');
  refreshSal();toast('Salary approved');
}

function submitAtt(){

// ============ MODAL / TOAST ============
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
var toastTmr=null;
function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+(type==='err'?'toast-err':'toast-ok');
  el.style.display='block';
  if(toastTmr)clearTimeout(toastTmr);
  toastTmr=setTimeout(function(){el.style.display='none';},3000);
}


// ============ DAILY ATTENDANCE REMINDER ============
function scheduleDailyNotif(){
  if(!CU||CU.role!=='employee')return;
  // Request notification permission
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission();
  }
  checkAndScheduleNotif();
}
function checkAndScheduleNotif(){
  if(!CU||CU.role!=='employee')return;
  var now=new Date();
  // IST = UTC+5:30
  var istOffset=5.5*60*60*1000;
  var istNow=new Date(now.getTime()+istOffset);
  var istH=istNow.getUTCHours(),istM=istNow.getUTCMinutes();
  // Target: 21:00 IST
  var targetH=21,targetM=0;
  var msUntilTarget;
  if(istH<targetH||(istH===targetH&&istM<targetM)){
    msUntilTarget=((targetH-istH)*60+(targetM-istM))*60000;
  } else {
    // past 9pm, schedule for tomorrow
    var msSinceMidnight=(istH*60+istM)*60000;
    var msInDay=24*60*60*1000;
    msUntilTarget=msInDay-msSinceMidnight+(targetH*60+targetM)*60000;
  }
  setTimeout(function(){
    fireAttendanceReminder();
    // Reschedule every 24h
    setInterval(fireAttendanceReminder,24*60*60*1000);
  },msUntilTarget);
}
function fireAttendanceReminder(){
  if(!CU||CU.role!=='employee')return;
  var today=new Date().toISOString().slice(0,10);
  var already=getA().filter(function(a){return a.userId===CU.id&&a.date===today;}).length>0;
  if(already)return; // already submitted
  // In-app toast
  showReminderBanner();
  // Browser push notification
  if('Notification' in window && Notification.permission==='granted'){
    var n=new Notification('Airdoor Staff Portal',{
      body:'\u23F0 Don\u2019t forget to submit your attendance for today!',
      icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2315283D%22/><text y=%22.9em%22 font-size=%2270%22 x=%2212%22>\u231A</text></svg>',
      tag:'att-reminder',
      requireInteraction:true
    });
    n.onclick=function(){window.focus();n.close();go('/att/submit');};
  }
}
function showReminderBanner(){
  var b=document.getElementById('reminderBanner');
  if(!b)return;
  b.style.display='flex';
  setTimeout(function(){b.style.display='none';},12000);
}

  if(window._fsLoad !== undefined){ init(); }
  else { setTimeout(startWhenReady, 50); }
})();
